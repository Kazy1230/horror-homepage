<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見本 ―― サンプル作品</title>
<link rel="stylesheet" href="../../common/horror.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="story">
  <h1 class="hfx-reveal">見本</h1>

  <p class="hfx-reveal">
    鏡を買い替えたのは、先月のことだった。新しい鏡は、驚くほど鮮明に、部屋の隅々まで映し出した。
  </p>

  <p class="hfx-reveal">
    最初に気づいたのは、歯を磨いているときだった。鏡の中の自分が、こちらより、ほんの一瞬だけ、遅れて動いた気がした。
  </p>

  <p class="hfx-reveal glitch-target">
    気のせいだと、思おうとした。でも、次の日も、その次の日も、鏡の中の私は、少しずつ、ずれていった。
  </p>

  <p class="hfx-reveal whisper-trigger" data-whisper="うしろ">
    ある夜、手を止めて、じっと見つめてみた。鏡の中の私も、手を止めて、こちらを見ていた。口が、小さく、動いた。
  </p>

  <div class="chapter-break scare-trigger" data-fx="flash">・　・　・</div>

  <p class="hfx-reveal">
    それ以来、鏡を見るときは、必ず、後ろも確認するようにしている。
  </p>

  <div class="btn-row hfx-reveal" data-reveal="near">
    <button id="manual-scare-button" class="manual-btn">もう一度、鏡を見る</button>
  </div>

  <a class="back-link hfx-reveal" data-reveal="near" href="../../">← 一覧に戻る</a>
</main>

<script src="../../common/horror.js"></script>
<script src="script.js"></script>
</body>
</html>
